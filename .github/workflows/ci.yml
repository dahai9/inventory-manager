name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: inventory_test
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INVENTORY_LICENSE_PUBLIC_KEY: N_gh4iltf8xgxm_Sx32aldM284sZROs7WvwBe0lze7s
      INVENTORY_NETWORK_TEST_ADMIN_URL: postgres://postgres:inventory_test@127.0.0.1:5432/inventory_test
      INVENTORY_NETWORK_TEST_RUNTIME_URL: postgres://inventory_runtime:inventory_runtime@127.0.0.1:5432/inventory_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev postgresql-client

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create restricted PostgreSQL runtime role
        env:
          PGPASSWORD: inventory_test
        run: >-
          psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE inventory_runtime LOGIN PASSWORD 'inventory_runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"

      - name: Apply PostgreSQL migrations
        env:
          PGPASSWORD: inventory_test
        run: |
          psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f src-tauri/migrations/postgres/0001_inventory_v2_core.sql
          psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f src-tauri/migrations/postgres/0002_network_identity.sql
          psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -f src-tauri/migrations/postgres/0003_network_runtime_security.sql
          psql -h 127.0.0.1 -U postgres -d inventory_test -v ON_ERROR_STOP=1 -v runtime_role=inventory_runtime -f src-tauri/deploy/postgres/runtime-role.sql

      - name: Test Rust workspace
        working-directory: src-tauri
        run: cargo test --workspace --all-targets

      - name: Test restricted PostgreSQL workflows
        working-directory: src-tauri
        run: cargo test --workspace --all-targets -- --ignored

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check working tree patches
        run: git diff --check
